{% extends 'base.html' %}
{% block title %}Nueva contraseña — Vision{% endblock %}

{% block extra_styles %}
<style>
    .auth-center {
        min-height: calc(100vh - 4rem);
        display: grid;
        place-items: center;
        padding: 2rem;
    }
    .auth-box {
        width: min(100%, 480px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 2px solid var(--accent);
        padding: 2.5rem;
    }
    .auth-kicker {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .sub {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-bottom: 2rem;
        line-height: 1.7;
    }
    label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    .pw-wrapper { position: relative; }
    input[type="password"], input[type="text"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        padding: 0.8rem 1rem;
        outline: none;
        transition: border-color 0.2s;
        border-radius: var(--radius);
    }
    input:focus { border-color: var(--accent); }
    .pw-toggle {
        position: absolute; right: 0.75rem; top: 50%;
        transform: translateY(-50%);
        background: none; border: none;
        color: var(--text-muted); cursor: pointer;
        font-family: var(--font-mono); font-size: 0.65rem;
        letter-spacing: 0.05em; text-transform: uppercase;
    }
    .pw-toggle:hover { color: var(--accent); }
    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: var(--accent);
        color: var(--bg);
        border: none;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: var(--radius);
        margin-top: 0.5rem;
    }
    .btn-submit:hover { background: #00b8cc; }
</style>
{% endblock %}

{% block content %}
<div class="auth-center">
    <div class="auth-box">
        <div class="auth-kicker">// Nueva contraseña</div>
        <h1>Restablecer contraseña</h1>
        <p class="sub">Elegí una contraseña segura para tu cuenta.</p>
        <form method="POST">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <div class="pw-wrapper">
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" id="toggle1">MOSTRAR</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar contraseña</label>
                <div class="pw-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" id="toggle2">MOSTRAR</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Guardar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function makeToggle(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', () => {
            const inp = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? 'MOSTRAR' : 'OCULTAR';
        });
    }
    makeToggle('toggle1', 'password');
    makeToggle('toggle2', 'confirm_password');
</script>
{% endblock %}
