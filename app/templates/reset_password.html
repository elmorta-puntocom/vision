{% extends 'base.html' %}
{% block title %}Nueva contraseña — Vision{% endblock %}

{% block extra_styles %}
<style>
    .auth-center {
        min-height: calc(100vh - 4rem);
        display: grid;
        place-items: center;
        padding: 3rem 1.5rem;
    }
    .auth-box {
        width: min(100%, 500px);
        background: 
            radial-gradient(circle at 50% 0%, rgba(0,229,255,0.08) 0%, transparent 70%),
            var(--surface);
        border: 1px solid var(--border);
        border-top: 3px solid var(--accent);
        padding: 3rem 2.5rem;
        border-radius: var(--radius);
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .auth-kicker {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
    }
    .auth-kicker::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        border-radius: 50%;
    }
    h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .sub {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 2.25rem;
        line-height: 1.7;
    }
    label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
    }
    .form-group { margin-bottom: 1.35rem; }
    .pw-wrapper { position: relative; }
    input[type="password"], input[type="text"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.88rem;
        padding: 0.85rem 1.1rem;
        outline: none;
        transition: border-color 0.25s, box-shadow 0.25s;
        border-radius: var(--radius);
    }
    input:focus { 
        border-color: var(--accent); 
        box-shadow: 0 0 15px rgba(0,229,255,0.25);
    }
    .pw-toggle {
        position: absolute; right: 0.85rem; top: 50%;
        transform: translateY(-50%);
        background: none; border: none;
        color: var(--text-muted); cursor: pointer;
        font-family: var(--font-mono); font-size: 0.65rem;
        letter-spacing: 0.08em; text-transform: uppercase;
        transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--accent); }
    .btn-submit {
        width: 100%;
        padding: 1.05rem;
        background: var(--accent);
        color: var(--bg);
        border: 1px solid var(--accent);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s ease;
        border-radius: var(--radius);
        margin-top: 0.75rem;
        box-shadow: 0 0 20px rgba(0,229,255,0.25);
    }
    .btn-submit:hover { 
        background: transparent; 
        color: var(--accent); 
        box-shadow: 0 0 30px rgba(0,229,255,0.45);
        transform: translateY(-1px);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-center">
    <div class="auth-box">
        <div class="auth-kicker">// Nueva contraseña</div>
        <h1>Restablecer contraseña</h1>
        <p class="sub">Elegí una contraseña segura para tu cuenta.</p>
        <form method="POST">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <div class="pw-wrapper">
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" id="toggle1">MOSTRAR</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar contraseña</label>
                <div class="pw-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="••••••••" required>
                    <button type="button" class="pw-toggle" id="toggle2">MOSTRAR</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Guardar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function makeToggle(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', () => {
            const inp = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? 'MOSTRAR' : 'OCULTAR';
        });
    }
    makeToggle('toggle1', 'password');
    makeToggle('toggle2', 'confirm_password');
</script>
{% endblock %}
